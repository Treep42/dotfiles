[mgr]
ratio = [2, 4, 3]
sort_by = "natural"
sort_sensitive = false
sort_dir_first = true
show_symlink = false

[plugin]
prepend_preloaders = [
  # Do not preload files in mounted locations:
  { url = "/run/media/turtle/**/*", run = "noop" },
]
prepend_previewers = [
  # Allow to preview folder.
  { url = "*/", run = "folder" },

  # preview audio file metadata
  { mime = "audio/*", run = "exifaudio"},

  # Do not previewing files in mounted locations.
  # Uncomment the line below to allow previewing text files.
  { mime = "{text/*,application/x-subrip}", run = "code" },

  # For mounted hard disk/drive.
  { url = "/run/media/turtle/**/*", run = "noop" },
]
prepend_fetchers = [
  { url = "*", run = "git", group = "git" },
  { url = "*/", run = "git", group = "git" },
]

[opener]
play = [
    { run = 'vlc "$@"', orphan = true }
]

