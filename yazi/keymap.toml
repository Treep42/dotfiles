# close input components on single escape
[[input.prepend_keymap]]
on = "<Esc>"
run = "close"
desc = "Cancel input"

# ZOOM PLUGIN
[[mgr.prepend_keymap]]
on   = "+"
run  = "plugin zoom 1"
desc = "Zoom in hovered file"

[[mgr.prepend_keymap]]
on   = "-"
run  = "plugin zoom -1"
desc = "Zoom out hovered file"

# SMART PASTE PLUGIN
[[mgr.prepend_keymap]]
on   = "p"
run  = "plugin smart-paste"
desc = "Paste into the hovered directory or CWD"

# SMART ENTER PLUGIN
[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

# CUSTOM go x KEYMAPS
[[mgr.prepend_keymap]]
on   = ["g", "m"]
run  = "cd /run/media/"
