$scriptsDir = $HOME/.config/hypr/scripts
# noctalia-shell ipc call
$ipc = qs -c noctalia-shell ipc call

$terminal = kitty
$fileManager = thunar
#$menu = rofi -show drun
$menu = $ipc launcher toggle

# See https://wiki.hypr.land/Configuring/Keywords/
$main = SUPER # Sets "Windows" key as main modifier

# main utility binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $main, Return, exec, $terminal
bind = $main, Q, killactive,
bind = $main, P, exec, $ipc lockScreen lock
# bind = $main, P, exec, loginctl lock-session
bind = $main, M, exec, $ipc sessionMenu toggle
# bind = $main, M, exit,
bind = $main, E, exec, $fileManager
bind = $main, V, togglefloating,
bind = $main, F, fullscreen, 0, toggle
bind = $main, D, exec, $menu
# bind = $main, B, pseudo, # dwindle
# bind = $main, X, togglesplit, # dwindle

# noctalia shell specifics
# -- network panel
bind = $main, F3, exec, $ipc network togglePanel
# -- volume panel
bind = $main, F4, exec, $ipc volume togglePanel
# -- media panel
bind = $main, F5, exec, $ipc media toggle

# CUSTOM FEATURES
# select emoji to clipboard:
bind = $main, period, exec, $scriptsDir/rofi-emoji-selector.sh
# bind = $main, period, exec, $ipc launcher emoji
# krunner style internet search with prefix:
bind = ALT, F2, exec, $scriptsDir/rofi-krunner-search.sh
# screenshotting an area:
bind =, Print, exec, sh -c 'REGION=$(slurp) || exit; grim -g "$REGION" - | wl-copy &&  wl-paste > ~/Pictures/Screenshots/Screenshot-$(date +%F_%T).png && notify-send "Screenshot-$(date +%F_%T).png " -t 4000 --icon accessories-screenshot'
# screenshotting an entire screen:
bind = SHIFT, Print, exec, grim - | wl-copy && wl-paste > ~/Pictures/screenshots/Screenshot-$(date +%F_%T).png && notify-send "Screenshot-$(date +%F_%T).png" -t 4000 --icon accessories-screenshot

# Move focus with main + arrow keys/hjkl
bind = $main, left,  movefocus, l
bind = $main, down,  movefocus, d
bind = $main, up,    movefocus, u
bind = $main, right, movefocus, r
bind = $main, H,     movefocus, l
bind = $main, J,     movefocus, d
bind = $main, K,     movefocus, u
bind = $main, L,     movefocus, r

# move window with arrow keys / hjkl
bind = $main SHIFT, left,  movewindoworgroup, l
bind = $main SHIFT, down,  movewindoworgroup, d
bind = $main SHIFT, up,    movewindoworgroup, u
bind = $main SHIFT, right, movewindoworgroup, r
bind = $main SHIFT, H,     movewindoworgroup, l
bind = $main SHIFT, J,     movewindoworgroup, d
bind = $main SHIFT, K,     movewindoworgroup, u
bind = $main SHIFT, L,     movewindoworgroup, r

# grouping
bind = $main, G, togglegroup,
bind = $main SHIFT, G, lockactivegroup, toggle
bind = $main, Tab, changegroupactive, f
bind = $main SHIFT, Tab, changegroupactive, b

# Switch workspaces with main + [0-9]
bind = $main, 1, workspace, 1
bind = $main, 2, workspace, 2
bind = $main, 3, workspace, 3
bind = $main, 4, workspace, 4
bind = $main, 5, workspace, 5
bind = $main, 6, workspace, 6
bind = $main, 7, workspace, 7
bind = $main, 8, workspace, 8
bind = $main, 9, workspace, 9
bind = $main, 0, workspace, 10

# Move active window to a workspace with main + SHIFT + [0-9]
bind = $main SHIFT, 1, movetoworkspace, 1
bind = $main SHIFT, 2, movetoworkspace, 2
bind = $main SHIFT, 3, movetoworkspace, 3
bind = $main SHIFT, 4, movetoworkspace, 4
bind = $main SHIFT, 5, movetoworkspace, 5
bind = $main SHIFT, 6, movetoworkspace, 6
bind = $main SHIFT, 7, movetoworkspace, 7
bind = $main SHIFT, 8, movetoworkspace, 8
bind = $main SHIFT, 9, movetoworkspace, 9
bind = $main SHIFT, 0, movetoworkspace, 10

# move workspaces between monitors
bind = $main ALT, h, movecurrentworkspacetomonitor, l
bind = $main ALT, l, movecurrentworkspacetomonitor, r

# scratchpad workspace
bind = $main, minus, togglespecialworkspace, magic
bind = $main SHIFT, minus, movetoworkspace, special:magic

# Scroll through existing workspaces with main + scroll
bind = $main, mouse_down, workspace, e+1
bind = $main, mouse_up, workspace, e-1

# Move/resize windows with main + LMB/RMB and dragging
bindm = $main, mouse:272, movewindow
bindm = $main, mouse:273, resizewindow

# start resize mode submap
bind = $main, R, exec, hyprctl notify 1 600000 0 " resize"
bind = $main, R, submap, resize
submap = resize
    binde = , left,  resizeactive, -10   0
    binde = , down,  resizeactive,   0  10
    binde = , up,    resizeactive,   0 -10
    binde = , right, resizeactive,  10   0
    binde = , h,     resizeactive, -10   0
    binde = , j,     resizeactive,   0  10
    binde = , k,     resizeactive,   0 -10
    binde = , l,     resizeactive,  10   0
    # end resize mode
    bind = , escape, exec, hyprctl dismissnotify
    bind = , escape, submap, reset
submap = reset
# end resize mode

#-- use noctalia-shell for volume
bindel = , XF86AudioRaiseVolume, exec, $ipc volume increase
bindel = , XF86AudioLowerVolume, exec, $ipc volume decrease
bindel = , XF86AudioMute, exec, $ipc volume muteOutput
bindel = , XF86AudioMicMute, exec, $ipc volume muteInput
#--brightness with noctalia-shell
bindel = , XF86MonBrightnessUp, exec, $ipc brightness increase
bindel = , XF86MonBrightnessDown, exec, $ipc brightness decrease
#--using noctalia-shell
bindl = , XF86AudioNext, exec, $ipc media next next
bindl = , XF86AudioPause, exec, $ipc media playPause
bindl = , XF86AudioPlay, exec, $ipc media playPause
bindl = , XF86AudioStop, exec, $ipc media playPause
bindl = , XF86AudioPrev, exec, $ipc media previous

